name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (synthetic databases, no real library)
        run: python -m unittest discover -s tests -t . -v
      - name: Installs and runs
        shell: bash
        run: |
          python -m pip install .
          rekfix --version
          rekfix --help > /dev/null
