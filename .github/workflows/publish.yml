# Publishing rekfix, with PyPI's trusted publishing: PyPI checks that an upload comes from this
# workflow in this repository, so no password or token is stored anywhere.
#
#   test:  Actions > publish > Run workflow. Uploads to TestPyPI as <version>.dev<run number>,
#          a new version each run (TestPyPI never takes the same version twice). Try it with
#          pip install -i https://test.pypi.org/simple/ rekfix==<that version>
#   real:  publish a GitHub release tagged v<version> (the version in pyproject.toml and
#          rekfix/__init__.py). Uploads that version to PyPI.
#
# One-time setup, as a "pending publisher" (Account settings > Publishing), with owner wolfybird,
# repository rekfix, workflow publish.yml:
#   test.pypi.org: environment testpypi
#   pypi.org:      environment pypi
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The versions agree (and match the release's tag)
        id: version
        run: |
          python - <<'EOF'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          code = re.search(r'__version__ = "([^"]+)"', open("rekfix/__init__.py").read())[1]
          assert version == code, f"pyproject.toml {version}, __init__.py {code}"
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert tag == version, f"tag {tag}, version {version}"
          else:                                   # a test upload: its own version, every run
              version = f"{version}.dev{os.environ['GITHUB_RUN_NUMBER']}"
              text = open("pyproject.toml").read()
              open("pyproject.toml", "w").write(re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
          print("version", version)
          EOF
      - name: Tests
        run: python -m unittest discover -s . -t .
      - name: Build the sdist and wheel, and check them
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rekfix/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rekfix/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
