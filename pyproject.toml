[project]
name = "rekfix"
version = "0.2.1"
description = "The last-ditch rescue for rekordbox USB sticks: diagnose, repair, rebuild or clone, before anything gets wiped"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["rekordbox", "pioneer", "cdj", "xdj", "usb", "export.pdb", "dj", "repair", "recovery", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Recovery Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wolfybird/rekfix"
Documentation = "https://github.com/wolfybird/rekfix/blob/main/docs/playbook.md"
Issues = "https://github.com/wolfybird/rekfix/issues"
"Ko-fi" = "https://ko-fi.com/rfrank"
"Buy Me a Coffee" = "https://buymeacoffee.com/wolfybird"

[project.scripts]
rekfix = "rekfix.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rekfix"]
